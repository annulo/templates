# 升级说明，新的在最上面：每条一个 version 加各语言一段（zh、en……，可以再加别的语言）。
# Annulo 的升级卡片按界面语言从这里取（没有这种语言用 en）；git tag 的说明只写英文，文件里没有这一版时才用它。
# Upgrade notes, newest first: each entry has a version plus one note per language (zh, en, … add more as needed).

- version: 0.13.0
  zh: Facebook 账号新增「浏览器方式／官方授权」选择：授权后勾选公共主页，已有主页可重新授权或切换连接方式，保留账号和帖子。官方通道支持文字、单图和多图帖子，视频继续使用浏览器方式。官方 API 采集显示可读指标和权限提示，自检区分发帖授权与数据读取。结果不确定的发布记录可重新核对，显示上次内容，确认未发布后再重试，避免重复发帖。可直接查看 Facebook 评论及回复正文、发布时间，支持刷新和加载更多。需要 Annulo 能力版本 39、social 插件 0.8.2，并启用 Facebook 授权中转；Meta 应用审核前仅供应用角色账号测试。
  en: "Facebook accounts now offer browser login or official authorization. Authorize, select Pages, and reconnect or switch existing Pages while keeping accounts and posts. The official channel supports text, single-image and multi-image posts; use the browser for videos. Collection displays metric availability and permission warnings; self-tests distinguish publishing authorization from data access. Uncertain posts show the previous content, offer a result check, and require confirmation before retrying to prevent duplicates. View Facebook comment and reply text with timestamps, refresh and load more. Requires Annulo API 39, social 0.8.2 and an enabled Facebook OAuth broker. App-role testing only until Meta app review."
- version: 0.12.0
  zh: 能从 Notion 导入文章：新建文章时只粘一篇 Notion 页面的链接，点「从 Notion 导入」存成草稿，图片存进资料库；文档改了文章页会提示，「从文档更新」拉回来（要先在 设置 → MCP 连上 Notion）。改写弹窗加了「转换」：不经过 AI，内容不动，只把长文、图文笔记、视频的格式互相换，另存一篇；同类型时是「复制」。文章列表每一行有「⋯」菜单：改写、复制、删除。新建文章默认选第一种类型。需要 Annulo 新版本。
  en: "Import articles from Notion: when creating an article, paste just a Notion page link and click \"Import from Notion\" to save it as a draft, with images saved to your library; when the document changes the article page says so, and \"Update from document\" pulls it in (connect Notion first in Settings \u2192 MCP). The rewrite dialog adds \"Convert\": no AI, the content stays as is and only the format changes between long-form, image posts and videos, saved as a new article; with the same type it is \"Duplicate\". Each row in the article list has a \"\u22ef\" menu: rewrite, duplicate, delete. New articles default to the first type. Needs the latest Annulo."
- version: 0.11.2
  zh: 内容中心只留一个「新建文章」：选类型，在「这篇想写什么」里写主题、要点或草稿，然后「自己写」或「让 AI 写」（写法每篇都照写作要求）；选类型时长文排在最后。文章页查看时正文加了边框，和编辑时对齐；图文笔记、视频的正文字号和长文一样，配图缩略图更大。「AI 要求」弹窗加了「关闭」按钮。
  en: "Content now has a single \"New article\": pick a type, put a subject, points or a draft in \"What to write\", then \"Write it myself\" or \"Let AI write it\" (writing instructions always apply); long-form is listed last among the types. The article page frames the body and lines it up with the editor; image posts and videos use the same text size as long-form, with bigger image thumbnails. The \"AI instructions\" dialog has a Close button."
- version: 0.11.1
  zh: 「出一批选题」点了先弹窗，可以写这一批的额外要求（只出某类主题、出几个…），不填就照默认要求出；选题页右边的「选题要求」按钮去掉了。
  en: "\"Suggest topics\" now opens a dialog first where you can add requirements for this batch (which kinds of topics, how many\u2026); leave it empty to follow the defaults. The separate \"Topic instructions\" button on the Topics tab is gone."
- version: 0.11.0
  zh: 排期的帖子到点发的是文章那时的内容：排期之后改了文章也不用取消重排；排期改由 Annulo 准时发（到点一分钟内）。需要 Annulo 新版本。
  en: "Scheduled posts go out with the article as it is at that moment, so you can keep editing after scheduling; Annulo now publishes them right on time (within a minute). Needs the latest Annulo."
- version: 0.10.2
  zh: 社媒平台的图标换成彩色的品牌 logo。改写成新文章时「改写要求」可以不填，不填就按目标类型的常规写法改；管理预设的编辑框里类型和要求都有了标签。
  en: Social platforms now show their full-color brand logos. When rewriting into a new article, instructions are optional — leave them empty to rewrite in the usual style for that type; the preset editor labels the type and instructions.
- version: 0.10.1
  zh: 添加账号后自动选中新加的那个；账号卡片上的名字不再被右边的按钮挤成一列。
  en: After adding an account, the new one is selected; account names on the cards are no longer squeezed by the buttons next to them.
- version: 0.10.0
  zh: 添加 Facebook、YouTube 时可以勾选要哪些主页、频道（需要社媒插件 v0.6.0，升级时会一起升）。图文笔记的配图能上传、直接粘贴图片，资料库和「从资料库选」也能粘贴上传。总览「今日工作」每一行都能点进对应的地方；账号失效的提示改成上下布局，「交给助手修」放在最前面；打开看、停止和运行按钮放在一行。
  en: "When adding Facebook or YouTube you pick which Pages and channels to add (needs the Social plugin v0.6.0, upgraded along with this). Image posts can upload or paste images, and the library and \"Pick from library\" accept pasted images too. Every row in Today's work on the overview links to its place; broken-account alerts are stacked with \"Have the assistant fix it\" first; Watch and Stop sit next to the run button."
- version: 0.9.1
  zh: 升级说明有了中英文：英文界面的升级卡片显示英文（需要 Annulo 下一个版本）。
  en: Upgrade notes now come in Chinese and English; the upgrade card follows your interface language (needs the next Annulo release).
- version: 0.9.0
  zh: 文章列表能直接删除，删完顶部提示。发布放到后台排队：右下角和发布记录里看每个账号进行到哪一步，能打开浏览器看、随时停止；自检、立即采集、登录也能打开看、停止。发布记录里点账号直接去「数据表现」。打开看需要 Annulo 2026.10.8-1 或更新。
  en: Delete articles right from the list, with a confirmation at the top. Publishing runs in the background — see each account's progress in the bottom-right corner and in the publishing records, open the browser to watch, or stop at any time; self-test, collect now and sign-in can be watched and stopped too. Click an account in the publishing records to jump to Performance. Watching needs Annulo 2026.10.8-1 or later.
- version: 0.8.0
  zh: 去掉媒体版本。文章分长文、图文笔记、视频三种类型，新建时先选；一键发布到支持这种类型的账号，可以多选、可以排期，每个账号一条发布记录。新增「改写」：改写成别的类型的新文章，常用要求存成改写预设。左侧内容中心的数字改成新文章数。
  en: Media versions are gone. Articles now come in three types — long-form, image post and video — chosen when you create one; publish in one click to every account that supports the type, pick several or schedule, with one publishing record per account. New "Rewrite" turns an article into a new one of another type, with your usual instructions saved as presets. The Content badge now counts new articles.
- version: 0.7.1
  zh: 左侧「内容中心」后面显示待审核的版本数，和总览的「待审核版本」一致；审核、修改后马上更新。
  en: The Content item in the sidebar shows how many versions await review, matching Overview; it updates right after you review or edit.
- version: 0.7.0
  zh: 知乎版本和文章一样是富文本：小标题、列表、加粗、引用、图片都在正文里，新建时直接拷一份文章正文。每个平台只显示自己有的字段（比如知乎没有单独的配图）。「AI 改写」先问这次怎么改。排期改成点了弹出的小气泡，已排期的显示时间和倒计时，也能直接立即发布；发布频率只是建议。弹窗里改过东西，点外面不会关掉。需要 Annulo 2026.10.7-2 或更新，升级时会先把社媒插件升到 v0.5.1。
  en: Zhihu versions are rich text like articles — headings, lists, bold, quotes and images live in the body, copied from the article when created. Each platform shows only its own fields. "AI rewrite" asks how to change it first. Scheduling opens a small popover; scheduled items show the time and a countdown and can be published right away; posting frequency is only a suggestion. Dialogs with unsaved changes no longer close on an outside click. Needs Annulo 2026.10.7-2 or later; upgrading first moves the Social plugin to v0.5.1.
- version: 0.6.0
  zh: 自媒体工作台：支持知乎。添加知乎账号，一篇内容可以改写成知乎专栏文章（小标题、列表、正文配图、最多 3 个话题），审核后发布或排期，采集阅读、赞同、评论、收藏。要先在 设置 → 项目 → 插件 里把社媒插件升到 v0.4.0
  en: "Creator workspace: Zhihu support. Add a Zhihu account, rewrite a piece into a Zhihu column article (headings, lists, inline images, up to 3 topics), review, then publish or schedule; views, upvotes, comments and saves are collected. Upgrade the Social plugin to v0.4.0 in Settings → Project → Plugins first."
- version: 0.5.3
  zh: 自媒体工作台：帮助手册按现在的界面重写，配了截图；页面标题和左侧导航统一（发布日历、每周总结、资料库、媒体版本）；起步向导填完定位后接着连社媒账号；B 站、抖音、YouTube 的发布频率提示和插件一致
  en: "Creator workspace: the help guide is rewritten for the current UI with screenshots; page titles match the sidebar; the setup guide moves on to connecting social accounts after positioning; posting-frequency hints for Bilibili, Douyin and YouTube match the plugin."
- version: 0.5.2
  zh: 自媒体工作台：点社媒帖子的配图打开大图，不会再误删第一张图；文章页的视频一栏同样修好。从 0.3.0 / 0.4.0 升级需要 Annulo 2026.10.7-1 或更新。
  en: "Creator workspace: clicking a post image opens it large instead of deleting the first image; the article video field is fixed the same way. Upgrading from 0.3.0 / 0.4.0 needs Annulo 2026.10.7-1 or later."
- version: 0.5.1
  zh: 自媒体工作台：媒体版本写作中能点「进行中 · 看过程」看对话；AI 改完版本后页面自动换成新内容；配图能拖动排序；文章里本机上传的图能配进社媒帖子；选中文字的格式条不再被工具条挡住。
  en: "Creator workspace: watch the chat while a media version is being written; the page refreshes after AI edits; drag to reorder images; locally uploaded article images can go into social posts; the selection format bar is no longer hidden by the toolbar."
- version: 0.5.0
  zh: 自媒体工作台换成新版：定位、选题和文章，富文本编辑，一篇文章改写成各平台的媒体版本后审核、发布或排期，资料库、发布日历、每周总结。和 0.4.0 结构不同，老项目升级合并不上，建议新建项目。需要 Annulo 2026.10.6-7 或更新。
  en: "A new Creator workspace: positioning, topics and articles with rich-text editing; turn an article into per-platform versions, review, publish or schedule; library, publishing calendar and weekly summary. The structure differs from 0.4.0, so old projects won't merge — create a new project. Needs Annulo 2026.10.6-7 or later."
- version: 0.4.0
  zh: 自媒体工作台：助手能把本机的图传进项目，配进稿件和社媒帖子；需要 Annulo 2026.10.6-7 或更新。
  en: "Creator workspace: the assistant can bring local images into the project for drafts and social posts. Needs Annulo 2026.10.6-7 or later."
- version: 0.3.0
  zh: 新增模板「自媒体工作台」：按定位出选题、写稿改稿，一篇稿件改写成各社媒平台的帖子，审核后发布或排期。
  en: "New template Creator workspace: topics from your positioning, drafting and revising, turning one draft into posts for each social platform, then review and publish or schedule."
